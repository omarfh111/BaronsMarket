name: smart_shopping_assistant
description: AI-powered mobile shopping assistant prototype.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  http_parser: ^4.1.2
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  flutter_spinkit: ^5.2.1
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo_app.png
  min_sdk_android: 21
